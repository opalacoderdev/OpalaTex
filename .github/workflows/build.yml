name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: .\build_exe.ps1

      - name: Build Linux/macOS
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x build_exe.sh
          ./build_exe.sh

      - name: Upload Artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OpalaTex-Windows
          path: dist/OpalaTex/

      - name: Upload Artifact (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OpalaTex-${{ matrix.os }}
          path: dist/OpalaTex/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip artifacts for release
        run: |
          cd artifacts
          zip -r OpalaTex-Windows.zip OpalaTex-Windows/
          zip -r OpalaTex-Ubuntu.zip OpalaTex-ubuntu-latest/
          zip -r OpalaTex-macOS.zip OpalaTex-macos-latest/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/OpalaTex-Windows.zip
            artifacts/OpalaTex-Ubuntu.zip
            artifacts/OpalaTex-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
