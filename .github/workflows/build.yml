name: Build and Release OpalaTex Community

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish as a GitHub Release. Leave empty to build the current branch without publishing.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A manual run that names a tag must build that tag's code, never the
          # branch the workflow was dispatched from.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A build that is going to be published must carry the Google OAuth client.
      # Without it every install from the release — which is what install.ps1 and
      # install.sh hand the user — has Cloud sync unable to open the Google
      # sign-in at all, and the app can only tell the user to go register
      # credentials in the Google Cloud console. The build scripts treat the
      # client as optional so a fork or a branch build still works; a release
      # cannot afford that, so it fails here, before 20 minutes of packaging.
      - name: Require the Google OAuth client for a published build
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        shell: bash
        env:
          OPALATEX_GDRIVE_CLIENT_ID: ${{ secrets.OPALATEX_GDRIVE_CLIENT_ID }}
          OPALATEX_GDRIVE_CLIENT_SECRET: ${{ secrets.OPALATEX_GDRIVE_CLIENT_SECRET }}
        run: |
          missing=""
          [ -z "$OPALATEX_GDRIVE_CLIENT_ID" ] && missing="OPALATEX_GDRIVE_CLIENT_ID"
          [ -z "$OPALATEX_GDRIVE_CLIENT_SECRET" ] && missing="$missing OPALATEX_GDRIVE_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Set them under Settings -> Secrets and variables -> Actions, then re-run this release. Publishing without them ships an app whose Cloud sync cannot connect."
            exit 1
          fi

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        # The Google OAuth client is optional for branch and fork builds only:
        # the step above makes it mandatory for anything published.
        env:
          OPALATEX_GDRIVE_CLIENT_ID: ${{ secrets.OPALATEX_GDRIVE_CLIENT_ID }}
          OPALATEX_GDRIVE_CLIENT_SECRET: ${{ secrets.OPALATEX_GDRIVE_CLIENT_SECRET }}
        run: .\build_exe.ps1

      - name: Build Linux/macOS
        if: matrix.os != 'windows-latest'
        env:
          OPALATEX_GDRIVE_CLIENT_ID: ${{ secrets.OPALATEX_GDRIVE_CLIENT_ID }}
          OPALATEX_GDRIVE_CLIENT_SECRET: ${{ secrets.OPALATEX_GDRIVE_CLIENT_SECRET }}
        run: |
          chmod +x build_exe.sh
          ./build_exe.sh

      # Having the secret does not prove the file reached the bundle: it is added
      # through a separate --add-data argument, and PyInstaller drops a missing
      # data file with a warning rather than an error. This is the check that the
      # published release v0.2.10 would have failed.
      - name: Verify the packaged app carries the OAuth client
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        shell: bash
        run: |
          found=$(find dist -name bundled_google_client.json | head -1)
          if [ -z "$found" ]; then
            echo "::error::The packaged app has no bundled_google_client.json. Cloud sync would ship unable to connect."
            exit 1
          fi
          echo "OAuth client packaged at $found"

      - name: Package Release Assets (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path dist\OpalaTex\* -DestinationPath OpalaTex-windows-x64.zip -Force

      - name: Package Release Assets (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czf OpalaTex-linux-x64.tar.gz -C dist/OpalaTex .

      - name: Package Release Assets (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          zip -r OpalaTex-macos-x64.zip dist/OpalaTex/

      - name: Upload Windows Asset
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OpalaTex-windows-x64
          path: OpalaTex-windows-x64.zip

      - name: Upload Linux Asset
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OpalaTex-linux-x64
          path: OpalaTex-linux-x64.tar.gz

      - name: Upload macOS Asset
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OpalaTex-macos-x64
          path: OpalaTex-macos-x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    # Publish on a tag push, and also on a manual run that explicitly names a
    # tag. Without the second case a workflow_dispatch run builds the assets and
    # then silently drops them, leaving the release with no downloads and both
    # installers failing with a 404.
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release-assets/OpalaTex-windows-x64/OpalaTex-windows-x64.zip
            release-assets/OpalaTex-linux-x64/OpalaTex-linux-x64.tar.gz
            release-assets/OpalaTex-macos-x64/OpalaTex-macos-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
