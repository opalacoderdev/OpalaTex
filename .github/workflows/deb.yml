name: Build Linux Mint 21 (.deb) Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional Git tag to check out and build (e.g. v0.2.45). Leave empty to build the selected branch.'
        required: false
        default: ''
      attach_to_release:
        description: 'Attach the built .deb to the existing GitHub Release for the specified tag (requires tag and OAuth secrets).'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb (Ubuntu 22.04 / Linux Mint 21)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Validate release publication inputs and secrets
        if: ${{ inputs.attach_to_release }}
        shell: bash
        env:
          OPALATEX_GDRIVE_CLIENT_ID: ${{ secrets.OPALATEX_GDRIVE_CLIENT_ID }}
          OPALATEX_GDRIVE_CLIENT_SECRET: ${{ secrets.OPALATEX_GDRIVE_CLIENT_SECRET }}
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            echo "::error::attach_to_release requires a non-empty tag input (e.g. v0.2.45)."
            exit 1
          fi
          missing=""
          [ -z "$OPALATEX_GDRIVE_CLIENT_ID" ] && missing="OPALATEX_GDRIVE_CLIENT_ID"
          [ -z "$OPALATEX_GDRIVE_CLIENT_SECRET" ] && missing="$missing OPALATEX_GDRIVE_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Publishing a .deb without them ships an app whose Cloud sync cannot connect."
            exit 1
          fi

      # Build inside Ubuntu 22.04 (glibc 2.35) so every system library copied by
      # PyInstaller stays compatible with Linux Mint 21 as well as newer releases.
      - name: Install Ubuntu 22.04 build toolchain, Python 3.11, and Qt runtime libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            dpkg-dev \
            git \
            gnupg \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libegl1 \
            libexpat1 \
            libfontconfig1 \
            libfreetype6 \
            libgbm1 \
            libgl1 \
            libgssapi-krb5-2 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libopengl0 \
            libpci3 \
            libpulse0 \
            libwayland-client0 \
            libwayland-cursor0 \
            libwayland-egl1 \
            libx11-6 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-glx0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-xkb1 \
            libxcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxi6 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libxkbfile1 \
            libxrandr2 \
            libxrender1 \
            libxshmfence1 \
            libxtst6 \
            software-properties-common \
            xz-utils

          for attempt in 1 2 3 4 5; do
            add-apt-repository -y -n ppa:deadsnakes/ppa && \
            apt-get update -o Acquire::Retries=5 && \
            apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
              python3.11 \
              python3.11-dev \
              python3.11-venv && break
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to install Python 3.11 from deadsnakes PPA after 5 attempts."
              exit 1
            fi
            echo "deadsnakes PPA install failed (attempt $attempt/5); retrying in 15s..."
            sleep 15
          done

          python3.11 -m venv /opt/build-venv
          /opt/build-venv/bin/pip install --upgrade pip
          /opt/build-venv/bin/pip install "tiktoken>=0.8.0"
          echo "/opt/build-venv/bin" >> "$GITHUB_PATH"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify build environment
        run: |
          cat /etc/os-release
          ldd --version | head -n 2
          python --version
          node --version
          npm --version

      - name: Build Linux bundle via build_exe.sh
        env:
          OPALATEX_GDRIVE_CLIENT_ID: ${{ secrets.OPALATEX_GDRIVE_CLIENT_ID }}
          OPALATEX_GDRIVE_CLIENT_SECRET: ${{ secrets.OPALATEX_GDRIVE_CLIENT_SECRET }}
        run: |
          chmod +x build_exe.sh
          ./build_exe.sh

      - name: Verify the packaged app carries the OAuth client when publishing
        if: ${{ inputs.attach_to_release }}
        run: |
          found=$(find dist -name bundled_google_client.json | head -1)
          if [ -z "$found" ]; then
            echo "::error::The packaged app has no bundled_google_client.json. Cloud sync would ship unable to connect."
            exit 1
          fi
          echo "OAuth client packaged at $found"

      - name: Package .deb and enforce GLIBC 2.35 ceiling
        run: |
          rm -rf build
          chmod +x scripts/build_deb.sh
          scripts/build_deb.sh \
            --bundle-dir dist/OpalaTex \
            --output-dir deb-out \
            --max-glibc 2.35
          ls -lh deb-out/*.deb
          dpkg-deb --info deb-out/*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpalaTex-linux-mint21-deb
          path: deb-out/*.deb
          if-no-files-found: error

  test-deb:
    name: Smoke test .deb on clean Ubuntu 22.04
    needs: build-deb
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: OpalaTex-linux-mint21-deb
          path: deb-out

      - name: Install .deb via apt and verify runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb
          cp deb-out/*.deb /tmp/
          chmod 0644 /tmp/opalatex_*.deb
          apt-get install -y --no-install-recommends /tmp/opalatex_*.deb

          test -x /usr/bin/opalatex
          test -f /usr/share/applications/opalatex.desktop
          test -f /usr/share/pixmaps/opalatex.png
          test ! -e /opt/opalatex/uninstall.sh
          test ! -e /opt/opalatex/_internal/uninstall.sh

          opalatex --version
          opalatex --help

          if [ -x /opt/opalatex/_internal/bin/tectonic ]; then
            /opt/opalatex/_internal/bin/tectonic --version
          fi
          if [ -x /opt/opalatex/_internal/bin/pandoc ]; then
            /opt/opalatex/_internal/bin/pandoc --version | head -n 2
          fi

          # Verify Qt xcb plugin, GL integrations, and QtWebEngineProcess resolve
          # all shared libraries on a stock Ubuntu 22.04 / Linux Mint 21 install.
          missing="$(
            LD_LIBRARY_PATH=/opt/opalatex/_internal ldd \
              /opt/opalatex/_internal/PyQt6/Qt6/plugins/platforms/libqxcb.so \
              /opt/opalatex/_internal/PyQt6/Qt6/plugins/xcbglintegrations/libqxcb-glx-integration.so \
              /opt/opalatex/_internal/PyQt6/Qt6/plugins/xcbglintegrations/libqxcb-egl-integration.so \
              /opt/opalatex/_internal/PyQt6/Qt6/libexec/QtWebEngineProcess \
              | grep 'not found' || true
          )"
          if [ -n "$missing" ]; then
            echo "::error::Unresolved shared libraries on clean Ubuntu 22.04:"
            echo "$missing"
            exit 1
          fi

          echo "Clean Ubuntu 22.04 / Linux Mint 21 smoke test passed."

  test-deb-2404:
    name: Smoke test .deb on clean Ubuntu 24.04 (Mint 22)
    needs: build-deb
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: OpalaTex-linux-mint21-deb
          path: deb-out

      - name: Install .deb and verify no Mesa/GVFS library shadowing on Ubuntu 24.04
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgl1-mesa-dri libglx-mesa0 libegl-mesa0
          cp deb-out/*.deb /tmp/
          chmod 0644 /tmp/opalatex_*.deb
          apt-get install -y --no-install-recommends /tmp/opalatex_*.deb

          opalatex --version
          opalatex --help

          if [ -x /opt/opalatex/_internal/bin/tectonic ]; then
            /opt/opalatex/_internal/bin/tectonic --version
          fi
          if [ -x /opt/opalatex/_internal/bin/pandoc ]; then
            /opt/opalatex/_internal/bin/pandoc --version | head -n 2
          fi

          # Verify host Mesa GLX/EGL drivers and Qt plugins link cleanly under
          # PyInstaller's LD_LIBRARY_PATH (regression check for bundled
          # libstdc++.so.6 breaking host LLVM GLIBCXX_3.4.32 / GLX).
          bad="$(
            LD_LIBRARY_PATH=/opt/opalatex/_internal ldd -r \
              /usr/lib/x86_64-linux-gnu/libGLX_mesa.so.0 \
              /usr/lib/x86_64-linux-gnu/libEGL_mesa.so.0 \
              /opt/opalatex/_internal/PyQt6/Qt6/plugins/platforms/libqxcb.so \
              /opt/opalatex/_internal/PyQt6/Qt6/plugins/xcbglintegrations/libqxcb-glx-integration.so \
              /opt/opalatex/_internal/PyQt6/Qt6/plugins/xcbglintegrations/libqxcb-egl-integration.so \
              /opt/opalatex/_internal/PyQt6/Qt6/libexec/QtWebEngineProcess \
              2>&1 | grep -E 'not found|undefined symbol' || true
          )"
          if [ -n "$bad" ]; then
            echo "::error::Library resolution or symbol conflict on Ubuntu 24.04:"
            echo "$bad"
            exit 1
          fi

          echo "Clean Ubuntu 24.04 / Linux Mint 22 smoke test passed."

  publish-deb:
    name: Attach .deb to existing GitHub Release
    needs: [build-deb, test-deb, test-deb-2404]
    if: ${{ inputs.attach_to_release && inputs.tag != '' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: OpalaTex-linux-mint21-deb
          path: deb-out

      - name: Upload .deb to existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          # Refuse to create a partial release; attach only to an existing one so
          # build.yml remains the sole owner of release creation and tar/zip assets.
          # When triggered alongside a tag push, build.yml may still be finishing
          # Windows/macOS builds, so wait up to 20 minutes for the release to appear.
          ready=0
          for attempt in $(seq 1 40); do
            if gh release view "$TARGET_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              ready=1
              break
            fi
            echo "Release $TARGET_TAG not published yet (attempt $attempt/40); waiting 30s..."
            sleep 30
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::GitHub Release $TARGET_TAG does not exist after waiting 20 minutes."
            exit 1
          fi
          gh release upload "$TARGET_TAG" deb-out/*.deb --clobber --repo "${{ github.repository }}"
