[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opalatex"
version = "0.2.4"
description = "Autonomous coding agent with interactive planning and modular execution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gilzamir Gomes", email = "dev@opalacoder.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "tenacity>=8.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "numpy>=1.21.0",
    "instructor>=1.15.1",
    "litellm>=1.95.0",
    "chromadb>=0.4.0",
    "pywebview>=4.0",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
    "PyQt6>=6.0.0",
    "PyQt6-WebEngine>=6.0.0",
    "qtpy>=2.4.0",
    "ddgs>=6.0",
    "Pillow>=10.0.0",
    "python-docx>=1.1.2",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    # Reads and writes PDF annotations for the standalone PDF viewer
    # (opalatex/pdf_annotations.py). Pinned explicitly rather than relied on
    # through pymupdf4llm: a user-facing feature should not hang off another
    # package's transitive dependency.
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "duckduckgo-search>=6.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0.0"]

[project.urls]
"Homepage" = "https://github.com/opalatexdev/OpalaTex"
"Bug Tracker" = "https://github.com/opalatexdev/OpalaTex/issues"

[project.scripts]
opalatex = "opalatex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["opalatex", "agenticblocks"]

[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "opalatex/config.yaml"
"skills" = "opalatex/skills"
"templates" = "opalatex/assetstore/templates"
