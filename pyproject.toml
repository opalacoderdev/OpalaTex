[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opalatex"
version = "0.2.16.1"
description = "Autonomous coding agent with interactive planning and modular execution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gilzamir Gomes", email = "dev@opalacoder.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "tenacity>=8.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "numpy>=1.21.0",
    "instructor>=1.15.1",
    "litellm>=1.95.0",
    "chromadb>=0.4.0",
    # Symbol extraction for search_code (opalatex/code_index.py). Declared here
    # and not only in requirements.txt: a pip install without it degraded to the
    # regex path silently.
    "tree-sitter>=0.25.0",
    "tree-sitter-language-pack>=1.8.0",
    "ddgs>=6.0",
    "Pillow>=10.0.0",
    "python-docx>=1.1.2",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    # Reads and writes PDF annotations for the standalone PDF viewer
    # (opalatex/pdf_annotations.py). Pinned explicitly rather than relied on
    # through pymupdf4llm: a user-facing feature should not hang off another
    # package's transitive dependency.
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "duckduckgo-search>=6.4.0",
    "pytest-asyncio>=0.23.0",
]

# The base install is the command-line interface: `pip install opalatex` (or
# `uv tool install opalatex`) gives a working agent -- projects, skills, tools,
# LaTeX compilation through a `tectonic` on PATH -- with no desktop stack.
#
# The desktop application needs the `gui` extra. Qt alone is several hundred MB
# that the CLI never imports: every Qt and pywebview import in the package is
# inside a function of `opalatex/ide_server.py`, so requiring them of every
# install only made the CLI expensive, never more capable. `opalatex --gui`
# without the extra fails with a diagnostic naming it (opalatex/cli.py), rather
# than falling back to a different interface than the one that was asked for.
[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0.0"]

# Local speech-to-text for the chat's dictation button (opalatex/transcription.py).
# MIT, CPU-only, and it brings ctranslate2 + av rather than torch. Models are
# downloaded on demand, not bundled.
speech = ["faster-whisper>=1.1.0"]

gui = [
    "pywebview>=4.0",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
    # Oldest Qt verified to run OpalaTex on Windows; see requirements.txt and
    # PROJECT_DESIGN.md 2.16.1 (6.8: PDF viewer breaks; 6.10.2: agent crashes).
    "PyQt6>=6.11.0",
    "PyQt6-Qt6>=6.11.2",
    "PyQt6-WebEngine>=6.11.0",
    "PyQt6-WebEngine-Qt6>=6.11.2",
    "qtpy>=2.4.0",
    "faster-whisper>=1.1.0",
]

# What the packaged desktop releases install.
all = [
    "opalatex[gui,embeddings]",
]

[project.urls]
"Homepage" = "https://github.com/opalacoderdev/OpalaTex"
"Bug Tracker" = "https://github.com/opalacoderdev/OpalaTex/issues"

[project.scripts]
opalatex = "opalatex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["opalatex", "agenticblocks"]
# The Google OAuth client is injected at build time and is .gitignore'd, and
# hatchling drops VCS-ignored files by default — which shipped every installed
# build (the snap included) without a client, so Cloud sync could only answer
# "this build carries no Google OAuth client" and sent the user to the Google
# Cloud console. `artifacts` is the exception list for exactly this: generated
# files that must be packaged. A missing file simply does not match, so a
# checkout without credentials still builds.
artifacts = ["opalatex/cloud/providers/bundled_google_client.json"]

[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "opalatex/config.yaml"
"skills" = "opalatex/skills"
"templates" = "opalatex/assetstore/templates"
