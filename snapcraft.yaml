name: opalatex
title: OpalaTex
version: "0.1.6"
summary: AI-assisted LaTeX editor and project IDE
description: |
  OpalaTex is a project-centric, AI-assisted LaTeX editor with a local
  Python backend, a React desktop interface, Git integration, document
  export tools, and optional Opala Cloud AI credits.

  Local editing features are free and open source. Cloud registration is
  only used for optional hosted AI requests and token balance management.

base: core24
grade: stable
confinement: strict
license: MIT
icon: AppIcons/OpalaTexArt1024.png
website:
  - https://www.opalacoder.com
source-code:
  - https://github.com/opalatexdev/OpalaTex
issues:
  - https://github.com/opalatexdev/OpalaTex/issues
contact:
  - dev@opalacoder.com
compression: lzo

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  opalatex:
    command: bin/opalatex-launch
    desktop: usr/share/applications/opalatex.desktop
    common-id: com.opalacoder.OpalaTex
    environment:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYWEBVIEW_GUI: qt
      QT_API: pyqt6
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QT_LOGGING_RULES: "*.debug=false;qt.qpa.*=false"
    plugs:
      - audio-playback
      - browser-support
      - desktop
      - desktop-legacy
      - home
      - network
      - network-bind
      - opengl
      - removable-media
      - wayland
      - x11

parts:
  opalatex:
    plugin: nil
    source: .
    build-snaps:
      - node/20/stable
    build-packages:
      - build-essential
      - ca-certificates
      - curl
      - libffi-dev
      - libssl-dev
      - pkg-config
      - python3-dev
      - python3-venv
    stage-packages:
      - git
      - python3.12
      - python3.12-minimal
      - python3.12-venv
      - libasound2t64
      - libatk-bridge2.0-0
      - libatk1.0-0
      - libcairo2
      - libcups2t64
      - libdbus-1-3
      - libdrm2
      - libegl1
      - libevent-2.1-7t64
      - libfontconfig1
      - libfreetype6
      - libgssapi-krb5-2
      - libgbm1
      - libgl1
      - libgl1-mesa-dri
      - libglx0
      - libglib2.0-0t64
      - libgtk-3-0t64
      - libice6
      - libminizip1t64
      - libnspr4
      - libnss3
      - libopengl0
      - libopus0
      - libpango-1.0-0
      - libpulse0
      - libre2-10
      - libsm6
      - libsnappy1v5
      - libwayland-client0
      - libwoff1
      - libx11-6
      - libx11-xcb1
      - libxcb-cursor0
      - libxcb-glx0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shm0
      - libxcb-shape0
      - libxcb-sync1
      - libxcb-util1
      - libxcb-xfixes0
      - libxcb-xinerama0
      - libxcb-xinput0
      - libxcb-xkb1
      - libxcb1
      - libxcomposite1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxi6
      - libxinerama1
      - libxkbcommon-x11-0
      - libxkbcommon0
      - libxkbfile1
      - libxrandr2
      - libxrender1
      - libxshmfence1
      - libxss1
      - libxtst6
      - pandoc
      - xdg-utils
    override-build: |
      set -eu

      cd gui_src
      npm ci
      npm run build
      cd ..

      test -f opalatex/gui/index.html

      python3 -m venv --copies "$CRAFT_PART_INSTALL"
      "$CRAFT_PART_INSTALL/bin/python" -m pip install --upgrade pip setuptools wheel
      "$CRAFT_PART_INSTALL/bin/python" -m pip install .

      mkdir -p "$CRAFT_PART_INSTALL/bin"
      curl -L "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-gnu.tar.gz" -o tectonic.tar.gz
      tar -xzf tectonic.tar.gz -C "$CRAFT_PART_INSTALL/bin"
      rm tectonic.tar.gz
      chmod +x "$CRAFT_PART_INSTALL/bin/tectonic"

      install -Dm755 snap/local/opalatex-launch "$CRAFT_PART_INSTALL/bin/opalatex-launch"
      install -Dm644 snap/gui/opalatex.desktop "$CRAFT_PART_INSTALL/usr/share/applications/opalatex.desktop"
    override-prime: |
      set -eu
      craftctl default

      arch_triplet="${CRAFT_ARCH_TRIPLET_BUILD_FOR:-x86_64-linux-gnu}"
      qt_lib_dir="$CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/Qt6/lib"
      export LD_LIBRARY_PATH="$CRAFT_PRIME/lib:$CRAFT_PRIME/lib/$arch_triplet:$CRAFT_PRIME/usr/lib:$CRAFT_PRIME/usr/lib/$arch_triplet:$qt_lib_dir:${LD_LIBRARY_PATH:-}"

      check_libs="
        $CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/QtCore.abi3.so
        $CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/QtGui.abi3.so
        $CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/QtWidgets.abi3.so
        $CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/QtNetwork.abi3.so
        $CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/QtWebEngineCore.abi3.so
        $CRAFT_PRIME/lib/python3.12/site-packages/PyQt6/QtWebEngineWidgets.abi3.so
      "
      missing="$(
        for lib in $check_libs; do
          if [ -f "$lib" ]; then
            ldd "$lib" 2>/dev/null
          else
            echo "Required PyQt6 module missing: $lib"
          fi
        done | grep -E 'not found|Required PyQt6 module missing' | sort -u || true
      )"
      if [ -n "$missing" ]; then
        echo "Unresolved native dependencies in PyQt6 payload:"
        echo "$missing"
        exit 1
      fi
