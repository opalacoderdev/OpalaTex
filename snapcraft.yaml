name: opalatex
title: OpalaTex
version: "0.1.26"
summary: AI-assisted LaTeX editor and project IDE
description: |
  OpalaTex is a project-centric, AI-assisted LaTeX editor with a local
  Python backend, a React desktop interface, Git integration, document
  export tools, and optional Opala Cloud AI credits.

  Local editing features are free and open source. Cloud registration is
  only used for optional hosted AI requests and token balance management.

base: core24
grade: stable
confinement: classic
license: MIT
icon: AppIcons/OpalaTexArt1024.png
website:
  - https://www.opalacoder.com
source-code:
  - https://github.com/opalatexdev/OpalaTex
issues:
  - https://github.com/opalatexdev/OpalaTex/issues
contact:
  - dev@opalacoder.com
compression: lzo

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  opalatex:
    command: bin/opalatex-launch
    desktop: usr/share/applications/opalatex.desktop
    common-id: com.opalacoder.OpalaTex
    environment:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYWEBVIEW_GUI: qt
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QT_LOGGING_RULES: "*.debug=false;qt.qpa.*=false"
    plugs:
      - audio-playback
      - browser-support
      - desktop
      - desktop-legacy
      - home
      - network
      - network-bind
      - opengl
      - removable-media
      - wayland
      - x11

parts:
  opalatex:
    plugin: python
    source: .
    python-packages:
      - .
    build-snaps:
      - node/20/stable
    build-packages:
      - build-essential
      - ca-certificates
      - curl
      - libffi-dev
      - libssl-dev
      - pkg-config
      - python3-dev
    stage-packages:
      - git
      - latexmk
      - libasound2t64
      - libatk-bridge2.0-0
      - libatk1.0-0
      - libcairo2
      - libcups2t64
      - libdbus-1-3
      - libdrm2
      - libegl1
      - libfontconfig1
      - libgbm1
      - libglib2.0-0t64
      - libgtk-3-0t64
      - libnspr4
      - libnss3
      - libopengl0
      - libpango-1.0-0
      - libpulse0
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xinerama0
      - libxcb1
      - libxcomposite1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxkbcommon-x11-0
      - libxkbcommon0
      - libxrandr2
      - libxrender1
      - pandoc
      - texlive-fonts-recommended
      - texlive-latex-base
      - texlive-latex-extra
      - texlive-latex-recommended
      - xdg-utils
    override-build: |
      set -eu

      cd gui_src
      npm ci
      npm run build
      cd ..

      rm -rf opalatex/gui
      mkdir -p opalatex/gui
      cp -a gui_src/dist/. opalatex/gui/

      craftctl default

      install -Dm755 snap/local/opalatex-launch "$CRAFT_PART_INSTALL/bin/opalatex-launch"
      install -Dm644 snap/gui/opalatex.desktop "$CRAFT_PART_INSTALL/usr/share/applications/opalatex.desktop"
