name: Madrid
description: >
  Beamer's most-used look: compact structure-blue title and footer bands, white
  frame titles, and a Latin Modern-style sans-serif type stack.
theme:
  background: "#ffffff"
  color: "#000000"
  accent: "#3333b3"
  fontFamily: "Latin Modern Sans, Nimbus Sans, Helvetica Neue, Arial, sans-serif"
  headerHeight: 132
  headerColor: "#3333b3"
  titleColor: "#ffffff"
  footerHeight: 24
  footerColor: "#3333b3"
  footerTextColor: "#ffffff"
  footerText: title
